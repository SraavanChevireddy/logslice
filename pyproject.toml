[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logslice"
version = "0.1.0"
description = "Reconstruct a single request's journey across many microservice logs by trace/correlation id."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sraavan Chevireddy" }]
keywords = ["logs", "tracing", "microservices", "observability", "cli", "correlation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Logging",
]

[project.scripts]
logslice = "logslice.cli:main"

[project.urls]
Homepage = "https://github.com/SraavanChevireddy/logslice"

[tool.setuptools.packages.find]
include = ["logslice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
